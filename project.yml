name: MachineCodingStarter
options:
  bundleIdPrefix: com.practice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  SWIFT_VERSION: "5.9"
targets:
  MachineCodingStarter:
    type: application
    platform: iOS
    sources:
      - path: MachineCodingStarter
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.practice.MachineCodingStarter
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
  MachineCodingStarterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MachineCodingStarterTests
    dependencies:
      - target: MachineCodingStarter
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.practice.MachineCodingStarterTests
schemes:
  MachineCodingStarter:
    build:
      targets:
        MachineCodingStarter: all
        MachineCodingStarterTests: [test]
    test:
      targets:
        - MachineCodingStarterTests
